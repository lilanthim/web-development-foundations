<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Elements</title>
    <style>
      .quote::before {
        /* opening quote */
        content: '"';
        font-size: 16px;
        color: gray;
      }

      .quote::after {
        /* closing quote */
        content: '"';
        font-size: 16px;
        color: gray;
      }

      .author {
        font-style: italic;
      }
    </style>
  </head>

  <body>
    <p class="quote">Once men turned their thinking over to machines in the hope that this would set them free. But that only permitted other men with machines to enslave them.</p>
    <p class="author">- Frank Herbert</p>
  </body>
</html>
