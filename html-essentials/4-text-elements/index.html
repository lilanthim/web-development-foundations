<!-- declares the document as HTML5 -->
<!DOCTYPE html>
<!-- this is the root element -->
<html>
  <!-- head tag includes metadata such as the title -->
  <head>
    <!-- meta tags are self-closing -->
    <!-- useful for search engine optimization -->
    <meta charset="UTF-8">
    <meta name="description" content="Learn HTML easily">
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <meta name="author" content="John Doe">
    <title>First Website</title>
  </head>
  <!-- body tag holds all visible content -->
  <body>
    <!-- heading tags h1-h6 organize content into sections from most important to least important -->
    <h1>Main Heading (h1)</h1>
    <h2>Sub Header (h2)</h2>
    <h3>Section Title (h3)</h3>
    <h4>Smaller Title (h4)</h4>
    <h5>Minor Heading (h5)</h5>
    <h6>Smallest Heading (h6)</h6>

    <!-- defines a paragraph of text -->
    <p>This is a paragraph (p)</p>

    <!-- block-level elements take up the full available width of their parent container -->
    <div style="background-color: lightgrey; padding: 10px;">
      <h3>Div Section</h3>
      <p>This is a block level container using &lt;div&gt;</p>
    </div>

    <!-- inline-level elements take up as much space as their content needs -->
    <!-- end inline CSS declarations with a semicolon (;)-->
    <p>
      This text contains 
      <span style="color: red; background-color: greenyellow;">a highlighted red word</span> 
      using a &lt;span&gt; tag
    </p>
  </body>
</html>
