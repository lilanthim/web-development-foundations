<!-- declares the document as HTML5 -->
<!DOCTYPE html>
<!-- this is the root element -->
<html>
  <!-- head tag includes metadata such as the title -->
  <head>
    <title>First Website</title>
  </head>
  <!-- body tag holds all visible content -->
  <body>
    <h1>Welcome!</h1>
    <p>This is a basic web page.</p>
  </body>
</html>
