<!-- use elements that describe their meaning and purpose -->
<!-- prefer semantic elements such as main, header over generic div and span elements -->
<!-- improves accessibility, SEO, and code readability -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic HTML</title>
  </head>
  <body>
    <h1>Welcome to Semantic HTML</h1>
    <p>This is a simple example of semantic html elements</p>
  </body>
</html>
