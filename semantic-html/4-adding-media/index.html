<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adding Media</title>
  </head>

  <body>
    <h2>Images, videos, and audio</h2>
    <!-- alt text describes image as a fallback, improves accessibility -->
    <img src="./yellowstone_national_park.jpg" alt="Grand Canyon of the Yellowstone Lower Falls" width="800">
    <img src="https://i.redd.it/10cy9m7g4p8c1.jpeg" alt="Master Oogway">
    <br>

    <video controls width="500">
      <source src="./big_buck_bunny.mp4" type="video/mp4">
    </video>
    <br>

    <audio controls>
      <source src="./synth_melody.mp3" type="audio/mpeg">
    </audio>
    <br>

    <h2>Embedding Youtube Videos</h2>
    <iframe 
    width="560" height="315" 
    src="https://www.youtube.com/embed/cYPJaHT5f3E?si=fx-K6yZqYzubDEUz" 
    title="YouTube video player" 
    frameborder="0" 
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
    referrerpolicy="strict-origin-when-cross-origin" 
    allowfullscreen>
    </iframe>
  </body>
</html>
