<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic HTML</title>
  </head>
  <body>
    <!-- defines the top section of a webpage (like a website banner) -->
    <header>
      <h1>My Website</h1>
      
      <!-- contains the navigation menu with links to other pages -->
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Blog</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
    </header>
    
    <!-- the primary content of the page (exluding sidebars/footers) -->
    <main>
      <!-- groups related content within the page -->
      <section>
        <h2>About Us</h2>
        <p>We build websites using clean HTML and CSS.</p>
      </section>
      
      <!-- used for self-contained content such as blog posts -->
      <article>
        <h2>Latest Blog Post</h2>
        <p>Understanding the importance of semantic HTML.</p>
      </article>

      <!-- represents sidebar content such as advertisements or related links -->
      <aside>
        <h3>Sidebar</h3>
        <p>Links to useful resources:</p>
        <ul>
          <li><a href="https://developer.mozilla.org/en-US/">MDN Web Docs</a></li>
          <li><a href="https://www.freecodecamp.org/learn>">freeCodeCamp</a></li>
        </ul>
      </aside>
    </main>

    <!-- contains copyright notices and extra information at the bottom -->
    <footer>
      <p>Copyright &copy; 2026</p>
    </footer>
  </body>
</html>
