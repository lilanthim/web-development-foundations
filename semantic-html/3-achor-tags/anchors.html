<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor Tags</title>
  </head>

  <body>
    <header>
      <h1>Anchor Tags</h1>
      <h2>(and hyperlinks)</h2>
    </header>

    <!-- anchor tags -->
    <!-- _blank = opens in new tab -->
    <a href="https://google.com" target="_blank">Google.com</a>
    <br>

    <!-- can hypertext reference to file path instead of URL -->
    <a href="./index.html">Home</a>
    <br>

    <!-- mailto: = opens default email app to send an email -->
    <a href="mailto:jane@example.com">Send Mail</a>
    <br>

    <!-- tel: = initiates a phone call -->
    <a href="tel:+12345678910">Call Us</a>
    <br>
    <br>

    <!-- #section = jumps to an element with a matching id -->
    <a href="#section">Go to section</a>
    <br>
    
    <div id="line-breaks">

    <div id="section">We are here</div>
  </body>
</html>
